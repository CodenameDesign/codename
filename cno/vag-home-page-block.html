<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .fg3-block {
    display: flex;
    width: 100%;
    max-width: 1290px;
    min-height: 560px;
    height: 560px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #000;
  }

  /* ── Left panel ── */
  .fg3-left {
    flex: 1 1 auto;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 52px;
    height: 100%;
  }

  .fg3-question {
    font-size: 86px;
    font-weight: 700;
    line-height: 1.05;
    color: #fff;
    letter-spacing: -0.02em;
    max-width: 480px;
  }

  .fg3-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 22px;
    text-decoration: none;
    border: 1px solid #fff;
    white-space: nowrap;
    width: fit-content;
    margin-top: 40px;
    transition: background 0.15s, color 0.15s;
  }
  .fg3-btn:hover { background: #fff; color: #000; }
  .fg3-btn:hover svg { stroke: #000; }

  .fg3-logos {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 48px;
  }
  .fg3-logo-cno { height: 44px; width: auto; display: block; }
  .fg3-logo-vag { height: 40px; width: auto; display: block; }

  /* ── Right panel ── */
  .fg3-right {
    flex: 0 0 322px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
    position: relative;
  }

  .fg3-img-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .fg3-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  .fg3-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
  }
  .fg3-caption-title {
    font-size: 13px;
    font-weight: 400;
    color: #111;
    line-height: 1.4;
    margin-bottom: 3px;
  }
  .fg3-caption-credit {
    font-size: 11px;
    font-style: italic;
    color: #555;
    line-height: 1.4;
  }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .fg3-block { flex-direction: column; height: auto; }
    .fg3-left { flex: none; padding: 32px 24px; height: auto; }
    .fg3-right { flex: none; aspect-ratio: 3 / 4; height: auto; }
    .fg3-question { font-size: 40px; }
  }
</style>
