<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Rebates & Incentives in Canada</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
<canada-solar-map></canada-solar-map>

<script>
class CanadaSolarMap extends HTMLElement {
  connectedCallback() {
    const shadow = this.attachShadow({ mode: 'open' });

    // All CSS lives inside the shadow root — Drupal cannot touch it
    shadow.innerHTML = `
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :host { display: block; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background: #fff; color: #1a1a2e; }
  .header { padding: 16px; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0; line-height: 1.2; }
  .header p { font-size: 0.82rem; color: #555; margin-top: 6px; line-height: 1.5; }
  .map-wrapper { display: flex; align-items: flex-start; width: 100%; }
  .filters { display: flex; flex-direction: column; gap: 6px; padding: 16px; flex-shrink: 0; }
  .filter-btn { font-family: inherit; font-size: 0.85rem; font-weight: 400; letter-spacing: 0; text-transform: none; padding: 6px 14px; border: none; border-radius: 20px; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; text-align: left; min-width: 140px; }
  .filter-btn[data-cat="solar"]   { color: #666; background: rgba(224,123,57,0.15); }
  .filter-btn[data-cat="battery"] { color: #666; background: rgba(58,122,191,0.15); }
  .filter-btn[data-cat="finance"] { color: #666; background: rgba(42,157,111,0.15); }
  .filter-btn[data-cat="tax"]     { color: #666; background: rgba(139,92,246,0.15); }
  .filter-btn[data-cat="net"]     { color: #666; background: rgba(192,57,43,0.15); }
  .filter-btn.active[data-cat="solar"]   { background: #e07b39; color: #fff; font-weight: 700; }
  .filter-btn.active[data-cat="battery"] { background: #3a7abf; color: #fff; font-weight: 700; }
  .filter-btn.active[data-cat="finance"] { background: #2a9d6f; color: #fff; font-weight: 700; }
  .filter-btn.active[data-cat="tax"]     { background: #8b5cf6; color: #fff; font-weight: 700; }
  .filter-btn.active[data-cat="net"]     { background: #c0392b; color: #fff; font-weight: 700; }
  .filter-btn:hover { opacity: 0.8; }
  .filter-btn.active:hover { opacity: 1; }
  .map-container { position: relative; flex: 1; min-width: 0; padding: 0; }
  svg#map { display: block; width: 100%; height: auto; }
  .province { stroke: #fff; stroke-width: 1px; transition: opacity 0.2s; }
  .see-all-btn { position: absolute; top: 16px; right: 16px; font-family: inherit; font-size: 0.72rem; font-weight: 600; padding: 5px 12px; border: none; border-radius: 20px; background: #e07b39; color: #fff; cursor: pointer; z-index: 20; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .see-all-btn:hover { opacity: 0.85; }
  .legend { display: flex; gap: 20px; padding: 12px 16px 8px; flex-wrap: wrap; font-size: 0.72rem; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  .footer { padding: 16px; font-size: 0.7rem; color: #888; margin-top: 8px; line-height: 1.6; }
  .footer a { color: #378ADD; }
  @media (max-width: 600px) {
    .map-wrapper { flex-direction: column; }
    .filters { flex-direction: row; flex-wrap: wrap; padding: 12px 16px; gap: 6px; }
    .filter-btn { min-width: unset; }
    .map-container { width: 100%; }
  }
</style>

<div class="header">
  <h1>Solar Rebates &amp; Incentives in Canada</h1>
  <p>Federal, provincial and local programs offer rebates and incentives for home solar systems. Select a program type to see what's available across Canada in 2026.</p>
</div>

<div class="map-wrapper">
  <div class="filters">
    <button class="filter-btn active" data-cat="solar">Solar rebates</button>
    <button class="filter-btn" data-cat="battery">Battery storage</button>
    <button class="filter-btn" data-cat="finance">Financing</button>
    <button class="filter-btn" data-cat="tax">Tax breaks</button>
    <button class="filter-btn" data-cat="net">Net metering</button>
  </div>
  <div class="map-container">
    <button class="see-all-btn" id="seeAllBtn">See all</button>
    <svg id="map"></svg>
  </div>
</div>

<div class="legend">
  <div class="legend-item" id="legend-active"><div class="legend-swatch" id="legend-color" style="background:#e07b39"></div> <span id="legend-label">Solar rebate available</span></div>
  <div class="legend-item" id="legend-limited"><div class="legend-swatch" id="legend-color-limited" style="background:#f0b078"></div> <span id="legend-label-limited">Solar rebate (select municipalities only)</span></div>
  <div class="legend-item" id="legend-paused"><div class="legend-swatch" style="background:#f0c090"></div> Program paused</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#d8d5cf"></div> No program identified</div>
</div>

<div class="footer">
  <strong>Notes</strong><br>
  kW — a kilowatt is a measure of power, equivalent to 1,000 watts<br>
  kWh — a kilowatt hour measures the power a device uses in one hour<br>
  PST — provincial sales tax<br><br>
  <strong>Federal incentives:</strong><br>
  Ottawa replaced a federal grant and loan programme with a no-cost home retrofit scheme for low-income Canadians in June 2026. Businesses are eligible for a Clean Technology investment tax credit that covers up to 30% of solar/clean-energy capital costs.<br><br>
  <strong>Source:</strong> <a href="http://solarguide.ca" target="_blank">SolarGuide.ca</a> / <a href="https://renewablesassociation.ca/" target="_blank">Canadian Renewable Energy Association</a><br>
  <strong>Links:</strong> SolarGuide on <a href="https://solarguide.ca/solar-rebates/" target="_blank">rebates/incentives</a> in Canada (2026) / CanREA <a href="https://renewablesassociation.ca/go-solar-guide/" target="_blank">Go Solar Guide</a> 2026
</div>
`;

    // Tooltip lives in document.body — outside shadow — so position:fixed works correctly
    let tooltip = document.getElementById('csm-tooltip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.id = 'csm-tooltip';
      tooltip.style.cssText = `
        position: fixed; background: #1a1a2e; color: #f7f5f0;
        padding: 14px 18px; border-radius: 3px;
        font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        font-size: 0.78rem; line-height: 1.55; max-width: 300px;
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
        z-index: 99999; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      `;
      tooltip.innerHTML = `
        <style>
          #csm-tooltip .tn { font-weight:700; font-size:0.88rem; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.2); color:#f7f5f0; }
          #csm-tooltip .tl { font-weight:700; font-size:0.72rem; margin-top:8px; margin-bottom:2px; }
          #csm-tooltip .tlt { opacity:0.7; }
          #csm-tooltip .tv { color:#f7f5f0; }
          #csm-tooltip .ts { font-size:0.65rem; font-weight:600; }
        </style>
      `;
      document.body.appendChild(tooltip);
    }

    // Panel and overlay also in document.body
    let panelOverlay = document.getElementById('csm-overlay');
    let panel = document.getElementById('csm-panel');
    if (!panelOverlay) {
      panelOverlay = document.createElement('div');
      panelOverlay.id = 'csm-overlay';
      panelOverlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:99998;';
      document.body.appendChild(panelOverlay);

      panel = document.createElement('div');
      panel.id = 'csm-panel';
      panel.style.cssText = `
        display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
        width:min(480px,92vw);max-height:80vh;background:#1a1a2e;color:#f7f5f0;
        border-radius:4px;z-index:99999;box-shadow:0 8px 32px rgba(0,0,0,0.4);
        overflow:hidden;flex-direction:column;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      `;
      panel.innerHTML = `
        <style>
          #csm-panel { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
          #csm-panel .ph { display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.12);flex-shrink:0; }
          #csm-panel .pt { font-size:0.85rem;font-weight:700; }
          #csm-panel .pc { background:none;border:none;color:#f7f5f0;font-size:1rem;cursor:pointer;opacity:0.6;padding:0 0 0 12px; }
          #csm-panel .pc:hover { opacity:1; }
          #csm-panel .pb { overflow-y:auto;padding:4px 0; }
          #csm-panel .pr { padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.07); }
          #csm-panel .pr:last-child { border-bottom:none; }
          #csm-panel .pp { font-size:0.82rem;font-weight:700;margin-bottom:4px;color:#f7f5f0; }
          #csm-panel .pv { font-size:0.78rem;color:rgba(247,245,240,0.85);line-height:1.5; }
          #csm-panel .ps { font-size:0.67rem;font-weight:600;margin-top:4px; }
        </style>
        <div class="ph">
          <span class="pt" id="csm-panel-title">Solar rebates — all provinces</span>
          <button class="pc" id="csm-panel-close">✕</button>
        </div>
        <div class="pb" id="csm-panel-body"></div>
      `;
      document.body.appendChild(panel);
    }

    const COLORS = {
      solar:'#e07b39', battery:'#3a7abf', finance:'#2a9d6f', tax:'#8b5cf6', net:'#c0392b'
    };
    const LABELS = {
      solar:'Solar rebate available', battery:'Battery storage program',
      finance:'Financing available', tax:'Tax break available', net:'Net metering / billing'
    };
    const LABELS_LIMITED = {
      solar:'Solar rebate (select municipalities only)', battery:'Battery program (select municipalities only)',
      finance:'Financing (select municipalities only)', tax:'Tax break (select municipalities only)',
      net:'Net metering (select municipalities only)'
    };
    const CAT_NAMES = {
      solar:'Solar rebate', battery:'Battery storage', finance:'Financing', tax:'Tax break', net:'Net metering'
    };
    const DATA = {
      'British Columbia': { solar:{value:'Up to $5,000 (BC Hydro) for rooftop solar',status:'active'}, battery:{value:'Up to $5,000 (BC Hydro) for storage paired with solar',status:'active'}, finance:{value:null}, tax:{value:'No PST on renewable energy gear, incl. solar',status:'active'}, net:{value:'Excess power credited at ~10¢/kWh',status:'active'} },
      'Alberta': { solar:{value:'$750/kW installed, up to $15,000 (Banff only); Canmore offers a limited $1,250 rebate',status:'limited'}, battery:{value:null}, finance:{value:'Up to $50,000 in property tax financing over 20 yrs (participating municipalities)',status:'limited'}, tax:{value:'No PST, saving $1,000–$2,000 vs other provinces',status:'active'}, net:{value:'Excess power credited at ~9¢/kWh',status:'active'} },
      'Saskatchewan': { solar:{value:null}, battery:{value:null}, finance:{value:'Up to $60,000 in low-interest loans repaid via property taxes (Saskatoon only)',status:'limited'}, tax:{value:null}, net:{value:null} },
      'Manitoba': { solar:{value:'Up to $5,000 per home (50¢/watt); 75¢/watt for businesses',status:'active'}, battery:{value:null}, finance:{value:'Up to $20,000 at 6.20% interest, repaid over 15 yrs via hydro bill',status:'active'}, tax:{value:null}, net:{value:'Net billing: surplus sold at ~4.4¢/kWh — size your system to match usage',status:'active'} },
      'Ontario': { solar:{value:'Up to $5,000 ($1,000/kW, max 5 kW)',status:'active'}, battery:{value:'Up to $5,000 (up to $12,000 for combined solar/battery with upgrades)',status:'active'}, finance:{value:'Up to $125,000 in low-interest loans, repaid via property taxes (Toronto, Ottawa only)',status:'limited'}, tax:{value:null}, net:{value:'Excess power credit at full retail rate for homes not claiming rebates',status:'active'} },
      'Quebec': { solar:{value:'$1,000/kW up to 40% of total installed cost',status:'active'}, battery:{value:null}, finance:{value:null}, tax:{value:null}, net:{value:'Hydro-Québec credits surplus power on your bill',status:'active'} },
      'New Brunswick': { solar:{value:'Up to $200/kW, max $3,000',status:'active'}, battery:{value:null}, finance:{value:null}, tax:{value:null}, net:{value:'Must comply with NB Power regulations',status:'active'} },
      'Prince Edward Island': { solar:{value:'Programme paused as of Sept. 2025',status:'paused'}, battery:{value:null}, finance:{value:null}, tax:{value:null}, net:{value:'1:1 kWh credit for power sent to grid, valued at full retail rate',status:'active'} },
      'Nova Scotia': { solar:{value:'No residential applications as of April 2025; non-profits still eligible',status:'paused'}, battery:{value:null}, finance:{value:'Loans at 4.75% over 10 yrs, tied to property (Halifax only)',status:'limited'}, tax:{value:null}, net:{value:'Full retail-rate credit (~18.5¢/kWh) with 12-month rollover',status:'active'} },
      'Newfoundland and Labrador': { solar:{value:null}, battery:{value:null}, finance:{value:null}, tax:{value:null}, net:{value:'1:1 monthly credits; annual surplus sold at wholesale rate (~15.2¢/kWh)',status:'active'} },
      'Nunavut': { solar:{value:'50% rebate up to $30,000 for homes; up to $5,000 for cabins',status:'active'}, battery:{value:null}, finance:{value:null}, tax:{value:null}, net:{value:null} },
      'Northwest Territories': { solar:{value:'$400/kW or up to 50% of project costs (whichever lower), max $20,000 residential / $50,000 business',status:'active'}, battery:{value:null}, finance:{value:null}, tax:{value:null}, net:{value:null} },
      'Yukon Territory': { solar:{value:'Solar rebate paused as of Jan. 2026',status:'paused'}, battery:{value:null}, finance:{value:'Up to 25% of assessed property value, max $50,000',status:'active'}, tax:{value:null}, net:{value:null} }
    };

    let currentCat = 'solar';

    const $ = id => shadow.getElementById(id);

    function getProvinceColor(name, cat) {
      const d = DATA[name]; if (!d) return '#d8d5cf';
      const p = d[cat]; if (!p || !p.value) return '#d8d5cf';
      if (p.status === 'paused') return '#f0c090';
      if (p.status === 'limited') return d3.color(COLORS[cat]).brighter(0.5).formatHex();
      return COLORS[cat];
    }

    function showTooltip(event, name) {
      const d = DATA[name]; if (!d) return;
      const prog = d[currentCat];
      if (!prog || !prog.value) { hideTooltip(); return; }
      let statusTag = '';
      if (prog.status === 'limited') statusTag = ` <span class="ts" style="color:${COLORS[currentCat]}">— Select municipalities only</span>`;
      if (prog.status === 'paused') statusTag = ` <span class="ts" style="color:${COLORS[currentCat]}">— Program paused</span>`;
      // Append after the style tag
      const styleEl = tooltip.querySelector('style');
      const content = `<div class="tn">${name}</div><div class="tl"><span class="tlt">${CAT_NAMES[currentCat]}</span>${statusTag}</div><div class="tv">${prog.value}</div>`;
      tooltip.innerHTML = styleEl.outerHTML + content;
      tooltip.style.opacity = '1';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      const x = event.clientX, y = event.clientY;
      const tw = Math.min(300, window.innerWidth - 24);
      tooltip.style.maxWidth = tw + 'px';
      let left = x + 16;
      if (left + tw > window.innerWidth - 8) left = x - tw - 8;
      left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
      let top = y + 16;
      const th = tooltip.offsetHeight || 120;
      if (top + th > window.innerHeight - 8) top = y - th - 8;
      tooltip.style.left = left + 'px';
      tooltip.style.top = Math.max(8, top) + 'px';
    }

    function hideTooltip() { tooltip.style.opacity = '0'; }

    function updateMap(cat) {
      currentCat = cat;
      d3.selectAll(shadow.querySelectorAll('.province'))
        .attr('fill', d => getProvinceColor(d.properties.name, cat))
        .style('cursor', d => { const p = DATA[d.properties.name]?.[cat]; return (p && p.value) ? 'pointer' : 'default'; });
      $('legend-color').style.background = COLORS[cat];
      $('legend-label').textContent = LABELS[cat];
      $('legend-color-limited').style.background = d3.color(COLORS[cat]).brighter(0.5).formatHex();
      $('legend-label-limited').textContent = LABELS_LIMITED[cat];
      $('seeAllBtn').style.background = COLORS[cat];
      const provinces = Object.values(DATA);
      $('legend-limited').style.display = provinces.some(d => d[cat]?.status === 'limited') ? 'flex' : 'none';
      $('legend-paused').style.display = provinces.some(d => d[cat]?.status === 'paused') ? 'flex' : 'none';
    }

    const svgEl = d3.select($('map'));
    const W = 960, H = 580;
    const getViewBox = () => window.innerWidth <= 600 ? '80 0 800 580' : '120 0 720 580';
    svgEl.attr('viewBox', getViewBox()).attr('preserveAspectRatio', 'xMidYMid meet');
    window.addEventListener('resize', () => svgEl.attr('viewBox', getViewBox()));

    const projection = d3.geoAlbers().rotate([96,0]).parallels([50,70]);
    const pathGen = d3.geoPath().projection(projection);

    d3.json('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/canada.geojson')
      .then(data => {
        projection.fitExtent([[10,10],[W-10,H-10]], data);
        svgEl.selectAll('.province').data(data.features).enter().append('path')
          .attr('class','province')
          .attr('d', pathGen)
          .attr('fill', d => getProvinceColor(d.properties.name, 'solar'))
          .style('cursor', d => { const p = DATA[d.properties.name]?.solar; return (p && p.value) ? 'pointer' : 'default'; })
          .on('mousemove', function(event, d) {
            const p = DATA[d.properties.name]?.[currentCat];
            if (p && p.value) d3.select(this).attr('opacity', 0.75);
            showTooltip(event, d.properties.name);
          })
          .on('touchstart', function(event, d) {
            event.preventDefault();
            const touch = event.touches[0];
            const p = DATA[d.properties.name]?.[currentCat];
            if (p && p.value) showTooltip(touch, d.properties.name);
          })
          .on('mouseleave', function() { d3.select(this).attr('opacity',1); hideTooltip(); })
          .on('touchend', function() { d3.select(this).attr('opacity',1); setTimeout(hideTooltip,2000); });
      });

    // See all panel
    const PROVINCE_ORDER = ['British Columbia','Alberta','Saskatchewan','Manitoba','Ontario','Quebec','New Brunswick','Nova Scotia','Prince Edward Island','Newfoundland and Labrador','Nunavut','Northwest Territories','Yukon Territory'];

    function openPanel() {
      const cat = currentCat;
      document.getElementById('csm-panel-title').textContent = `${CAT_NAMES[cat]} — all provinces & territories`;
      let html = '';
      PROVINCE_ORDER.forEach(name => {
        const prog = DATA[name]?.[cat];
        if (!prog || !prog.value) return;
        html += `<div class="pr"><div class="pp">${name}</div><div class="pv">${prog.value}</div>`;
        if (prog.status === 'limited') html += `<div class="ps" style="color:${COLORS[cat]}">Select municipalities only</div>`;
        else if (prog.status === 'paused') html += `<div class="ps" style="color:${COLORS[cat]}">Program paused</div>`;
        html += `</div>`;
      });
      document.getElementById('csm-panel-body').innerHTML = html;
      panel.style.display = 'flex';
      panelOverlay.style.display = 'block';
    }

    function closePanel() { panel.style.display = 'none'; panelOverlay.style.display = 'none'; }

    $('seeAllBtn').addEventListener('click', openPanel);
    document.getElementById('csm-panel-close').addEventListener('click', closePanel);
    panelOverlay.addEventListener('click', closePanel);

    shadow.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        shadow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        updateMap(this.dataset.cat);
      });
    });
  }
}

customElements.define('canada-solar-map', CanadaSolarMap);
</script>
</body>
</html>
